// Android 只增加打包外壳，插件和依赖全部使用官方仓库。
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
// 固定插件版本由根 build.gradle 声明，不跟随 Studio 自动升级。
dependencyResolutionManagement { repositories { google(); mavenCentral() } }
rootProject.name = 'MusicMapMakerAndroid'
include ':app'

// Studio 直接打开时也使用与脚本相同的仓库外工作树，避免要求用户创建本机路径配置。
def sdk = System.getenv('ANDROID_HOME') ?: new File(System.getProperty('user.home'), 'Android/Sdk').path
def work = new File(providers.gradleProperty('mmmAndroidWorkDir').getOrElse("${sdk}/../mmm-smoke/main")).canonicalFile
def repository = new File(settingsDir, '../..').canonicalFile
if (work.toPath().startsWith(repository.toPath())) throw new GradleException('Android work directory must be outside the repository.')
// 项目缓存独立于 Gradle 下载缓存，Studio 同步也不能生成源码旁的 .gradle。
if (gradle.startParameter.projectCacheDir == null) gradle.startParameter.projectCacheDir = new File(work, 'cache/gradle-project')
// 根工程和应用模块共享规范化后的路径，命令行仍可用 -P 显式覆盖。
gradle.beforeProject { project -> project.ext.mmmResolvedWorkDir = work.path }
