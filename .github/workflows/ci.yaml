name: Self Hosted CI Runner

on:
  push:
    branches: [ci]
  workflow_dispatch:
    inputs:
      job:
        description: "手动执行的任务"
        required: true
        type: choice
        default: website-release
        options:
          - website-release
          - ci-build

concurrency:
  group: self-hosted-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mmm-debian-ci:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'ci-build')
    runs-on: [self-hosted, Linux, X64, debian]

    defaults:
      run:
        shell: bash
        working-directory: /home/xiang/MusicMapMaker-Next

    steps:
      - name: ci->Sync Repository
        run: |
          set -euo pipefail

          ci_git_sync_lock="/home/xiang/MusicMapMaker-Next/.git/mmm-ci-sync.lock"
          exec 9>"${ci_git_sync_lock}"
          flock 9

          if [[ -e .git/index.lock ]]; then
            active_git_processes="$(
              ps -u "$(id -u)" -o pid=,comm=,args= \
                | awk '$2 == "git" || $2 ~ /^git-/ { print }'
            )"
            if [[ -n "${active_git_processes}" ]]; then
              printf "error: .git/index.lock exists and git is still running:\n%s\n" "${active_git_processes}" >&2
              exit 1
            fi

            printf "warning: removing stale git index lock: .git/index.lock\n" >&2
            rm -f .git/index.lock
          fi

          git fetch --prune origin +refs/heads/ci:refs/remotes/origin/ci
          git clean -fd -- scripts/ci .github/workflows
          git checkout --force -B ci origin/ci
          git reset --hard origin/ci
          git submodule update --init --recursive
          git lfs pull

      - name: ci->Windows MSVC Clang Cross Build
        run: |
          set -euo pipefail
          bash scripts/ci/cross/msvc-clang-build.sh

      - name: ci->Windows MinGW GCC Cross Build
        run: |
          set -euo pipefail
          bash scripts/ci/cross/mingw-gcc-build.sh

      - name: ci->Windows MinGW Clang Cross Build
        run: |
          set -euo pipefail
          bash scripts/ci/cross/mingw-clang-build.sh

      - name: ci->Linux GCC 14 Native Build
        run: |
          set -euo pipefail
          bash scripts/ci/linux-build.sh --compiler gcc14

      - name: ci->Linux Clang 19 Native Build
        run: |
          set -euo pipefail
          bash scripts/ci/linux-build.sh --compiler clang19

      - name: ci->Package Release
        run: |
          set -euo pipefail

          copy_bin() {
            local build_dir="$1"
            local release_name="$2"
            local source_dir="${build_dir}/bin"
            local target_dir="release/${release_name}"

            if [[ ! -d "${source_dir}" ]]; then
              printf "error: build output directory not found: %s\n" "${source_dir}" >&2
              exit 1
            fi

            mkdir -p "${target_dir}"
            cp -a "${source_dir}/." "${target_dir}/"
          }

          rm -rf release
          mkdir -p release

          copy_bin build_cross_msvc windows-msvc-clang
          copy_bin build_cross_mingw_gcc windows-mingw-gcc
          copy_bin build_cross_mingw_clang windows-mingw-clang
          copy_bin build_linux_gcc14 linux-gcc14
          copy_bin build_linux_clang19 linux-clang19

          if [[ ! -d assets ]]; then
            printf "error: assets directory not found\n" >&2
            exit 1
          fi

          cp -a assets release/assets
          find release -maxdepth 2 -type f | sort

  mmm-macos-ci:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'ci-build')
    runs-on: [self-hosted, macOS, ARM64, musicmapmaker-next]

    defaults:
      run:
        shell: bash

    steps:
      - name: ci->Checkout Repository
        uses: actions/checkout@v6
        with:
          # 自托管 macOS Runner 保留被 Git 忽略的 build_ci_macos_arm64 增量缓存。
          clean: false
          lfs: true
          submodules: recursive

      - name: ci->macOS AppleClang ARM64 Build
        run: |
          set -euo pipefail
          bash scripts/ci/macos-build.sh \
            --arch arm64 \
            --build-dir build_ci_macos_arm64

      - name: ci->macOS CTest
        run: |
          set -euo pipefail
          ctest --test-dir build_ci_macos_arm64 \
            --parallel "$(sysctl -n hw.logicalcpu)" \
            --output-on-failure

      - name: ci->Package and Stage macOS Release
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_RUN_ID}" =~ ^[0-9]+$ ]]; then
            printf "error: invalid GitHub run id: %s\n" "${GITHUB_RUN_ID}" >&2
            exit 1
          fi

          package_dir="build_ci_macos_arm64/packages"
          transfer_dir="build_ci_macos_arm64/transfer"
          remote_staging="/home/xiang/MusicMapMaker-Next/.git/mmm-ci-transfer/${GITHUB_RUN_ID}/macos-arm64"

          rm -rf "${package_dir}" "${transfer_dir}"
          bash scripts/ci/macos-package.sh \
            --arch arm64 \
            --build-dir build_ci_macos_arm64 \
            --package-dir "${package_dir}" \
            --build-type RelWithDebInfo \
            --package-only

          dmg_path="$(find "${package_dir}" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          app_zip_path="$(find "${package_dir}" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          updater_path="${package_dir}/MusicMapMaker-Updater"
          [[ -n "${dmg_path}" && -f "${dmg_path}" ]]
          [[ -n "${app_zip_path}" && -f "${app_zip_path}" ]]
          [[ -f "${updater_path}" ]]

          mkdir -p "${transfer_dir}"
          cp "${dmg_path}" "${transfer_dir}/MusicMapMaker-Next.dmg"
          cp "${app_zip_path}" "${transfer_dir}/MusicMapMaker-Next.app.zip"
          cp "${updater_path}" "${transfer_dir}/MusicMapMaker-Updater"
          (
            cd "${transfer_dir}"
            shasum -a 256 \
              MusicMapMaker-Next.dmg \
              MusicMapMaker-Next.app.zip \
              MusicMapMaker-Updater > SHA256SUMS
          )

          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            xiang@192.168.31.12 \
            "rm -rf -- '${remote_staging}' && mkdir -p '${remote_staging}'"
          rsync -av --delete \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            "${transfer_dir}/" \
            "xiang@192.168.31.12:${remote_staging}/"

  mmm-release-aggregate:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'ci-build')
    needs: [mmm-debian-ci, mmm-macos-ci]
    runs-on: [self-hosted, Linux, X64, debian]

    defaults:
      run:
        shell: bash
        working-directory: /home/xiang/MusicMapMaker-Next

    steps:
      - name: ci->Aggregate macOS Release
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_RUN_ID}" =~ ^[0-9]+$ ]]; then
            printf "error: invalid GitHub run id: %s\n" "${GITHUB_RUN_ID}" >&2
            exit 1
          fi

          transfer_root="/home/xiang/MusicMapMaker-Next/.git/mmm-ci-transfer/${GITHUB_RUN_ID}"
          source_dir="${transfer_root}/macos-arm64"
          target_dir="/home/xiang/MusicMapMaker-Next/release/macos-arm64"
          next_dir="/home/xiang/MusicMapMaker-Next/release/.macos-arm64-${GITHUB_RUN_ID}.next"
          previous_dir="/home/xiang/MusicMapMaker-Next/release/.macos-arm64-${GITHUB_RUN_ID}.previous"

          [[ -d "${source_dir}" ]]
          [[ -f "${source_dir}/MusicMapMaker-Next.dmg" ]]
          [[ -f "${source_dir}/MusicMapMaker-Next.app.zip" ]]
          [[ -f "${source_dir}/MusicMapMaker-Updater" ]]
          (
            cd "${source_dir}"
            sha256sum -c SHA256SUMS
          )

          rm -rf "${next_dir}" "${previous_dir}"
          mkdir -p "${next_dir}"
          cp -a "${source_dir}/." "${next_dir}/"

          if [[ -e "${target_dir}" ]]; then
            mv "${target_dir}" "${previous_dir}"
          fi
          if ! mv "${next_dir}" "${target_dir}"; then
            if [[ -e "${previous_dir}" ]]; then
              mv "${previous_dir}" "${target_dir}"
            fi
            exit 1
          fi

          rm -rf "${previous_dir}" "${transfer_root}"
          find "${target_dir}" -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort

  mmm-website-release:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'website-release'
    runs-on: [self-hosted, Linux, X64, debian]

    defaults:
      run:
        shell: bash
        working-directory: /home/xiang/MusicMapMaker-Next

    steps:
      - name: ci->Sync Repository
        run: |
          set -euo pipefail

          ci_git_sync_lock="/home/xiang/MusicMapMaker-Next/.git/mmm-ci-sync.lock"
          exec 9>"${ci_git_sync_lock}"
          flock 9

          if [[ -e .git/index.lock ]]; then
            active_git_processes="$(
              ps -u "$(id -u)" -o pid=,comm=,args= \
                | awk '$2 == "git" || $2 ~ /^git-/ { print }'
            )"
            if [[ -n "${active_git_processes}" ]]; then
              printf "error: .git/index.lock exists and git is still running:\n%s\n" "${active_git_processes}" >&2
              exit 1
            fi

            printf "warning: removing stale git index lock: .git/index.lock\n" >&2
            rm -f .git/index.lock
          fi

          git fetch --prune origin +refs/heads/ci:refs/remotes/origin/ci
          git clean -fd -- scripts/ci .github/workflows
          git checkout --force -B ci origin/ci
          git reset --hard origin/ci

      - name: ci->Publish Website Release
        run: |
          if [[ -f "${HOME}/.bashrc" ]]; then
            source "${HOME}/.bashrc" || true
          fi
          set -euo pipefail
          bash scripts/ci/publish-website-release.sh \
            --source-release /home/xiang/MusicMapMaker-Next/release \
            --website-dir /home/xiang/mmm-website
