name: Self Hosted CI Runner

on:
  push:
    branches: [ci]
  workflow_dispatch:
    inputs:
      job:
        description: "手动执行的任务"
        required: true
        type: choice
        default: website-release
        options:
          - website-release
          - ci-build

concurrency:
  group: self-hosted-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mmm-debian-ci:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'ci-build')
    runs-on: [self-hosted, Linux, X64, debian]

    defaults:
      run:
        shell: bash
        working-directory: /home/xiang/MusicMapMaker-Next

    steps:
      - name: ci->Sync Repository
        run: |
          set -euo pipefail

          ci_git_sync_lock="/home/xiang/MusicMapMaker-Next/.git/mmm-ci-sync.lock"
          exec 9>"${ci_git_sync_lock}"
          flock 9

          if [[ -e .git/index.lock ]]; then
            active_git_processes="$(
              ps -u "$(id -u)" -o pid=,comm=,args= \
                | awk '$2 == "git" || $2 ~ /^git-/ { print }'
            )"
            if [[ -n "${active_git_processes}" ]]; then
              printf "error: .git/index.lock exists and git is still running:\n%s\n" "${active_git_processes}" >&2
              exit 1
            fi

            printf "warning: removing stale git index lock: .git/index.lock\n" >&2
            rm -f .git/index.lock
          fi

          git fetch --prune origin +refs/heads/ci:refs/remotes/origin/ci
          git clean -fd -- scripts/ci .github/workflows
          git checkout --force -B ci origin/ci
          git reset --hard origin/ci
          git submodule update --init --recursive
          git lfs pull

      - name: ci->Windows MSVC Clang Cross Build
        run: |
          set -euo pipefail
          bash scripts/ci/cross/msvc-clang-build.sh

      - name: ci->Windows MinGW GCC Cross Build
        run: |
          set -euo pipefail
          bash scripts/ci/cross/mingw-gcc-build.sh

      - name: ci->Windows MinGW Clang Cross Build
        run: |
          set -euo pipefail
          bash scripts/ci/cross/mingw-clang-build.sh

      - name: ci->Linux GCC 14 Native Build
        run: |
          set -euo pipefail
          bash scripts/ci/linux-build.sh --compiler gcc14

      - name: ci->Linux Clang 19 Native Build
        run: |
          set -euo pipefail
          bash scripts/ci/linux-build.sh --compiler clang19

      - name: ci->Package Release
        run: |
          set -euo pipefail

          copy_bin() {
            local build_dir="$1"
            local release_name="$2"
            local source_dir="${build_dir}/bin"
            local target_dir="release/${release_name}"

            if [[ ! -d "${source_dir}" ]]; then
              printf "error: build output directory not found: %s\n" "${source_dir}" >&2
              exit 1
            fi

            mkdir -p "${target_dir}"
            cp -a "${source_dir}/." "${target_dir}/"
          }

          rm -rf release
          mkdir -p release

          copy_bin build_cross_msvc windows-msvc-clang
          copy_bin build_cross_mingw_gcc windows-mingw-gcc
          copy_bin build_cross_mingw_clang windows-mingw-clang
          copy_bin build_linux_gcc14 linux-gcc14
          copy_bin build_linux_clang19 linux-clang19

          if [[ ! -d assets ]]; then
            printf "error: assets directory not found\n" >&2
            exit 1
          fi

          cp -a assets release/assets
          find release -maxdepth 2 -type f | sort

  mmm-website-release:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'website-release'
    runs-on: [self-hosted, Linux, X64, debian]

    defaults:
      run:
        shell: bash
        working-directory: /home/xiang/MusicMapMaker-Next

    steps:
      - name: ci->Sync Repository
        run: |
          set -euo pipefail

          ci_git_sync_lock="/home/xiang/MusicMapMaker-Next/.git/mmm-ci-sync.lock"
          exec 9>"${ci_git_sync_lock}"
          flock 9

          if [[ -e .git/index.lock ]]; then
            active_git_processes="$(
              ps -u "$(id -u)" -o pid=,comm=,args= \
                | awk '$2 == "git" || $2 ~ /^git-/ { print }'
            )"
            if [[ -n "${active_git_processes}" ]]; then
              printf "error: .git/index.lock exists and git is still running:\n%s\n" "${active_git_processes}" >&2
              exit 1
            fi

            printf "warning: removing stale git index lock: .git/index.lock\n" >&2
            rm -f .git/index.lock
          fi

          git fetch --prune origin +refs/heads/ci:refs/remotes/origin/ci
          git clean -fd -- scripts/ci .github/workflows
          git checkout --force -B ci origin/ci
          git reset --hard origin/ci

      - name: ci->Publish Website Release
        run: |
          if [[ -f "${HOME}/.bashrc" ]]; then
            source "${HOME}/.bashrc" || true
          fi
          set -euo pipefail
          bash scripts/ci/publish-website-release.sh \
            --source-release /home/xiang/MusicMapMaker-Next/release \
            --website-dir /home/xiang/mmm-website
