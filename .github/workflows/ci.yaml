name: Self Hosted CI Runner
# 主入口只保留任务选择，原构建和网站发布位于可复用工作流。
on:
  push:
    # 普通开发与维护分支不会因 push 自动执行跨平台发布构建。
    branches: [ci]
  workflow_dispatch:
    # GitHub 页面保留一个下拉菜单作为全部人工操作入口。
    inputs:
      job:
        # 默认行为仍是普通网站发布，新增 hotfix 不改变旧调用参数。
        description: "手动执行的任务"
        required: true
        type: choice
        default: website-release
        options: [website-release, ci-build, hotfix]
      pgo_instrument:
        # 手动 false 必须传到构建子工作流，不能被表达式回退成 true。
        description: "启用业务模块 PGO 插桩采集（需要 LLVM 工具链）"
        required: true
        type: boolean
        default: true
      hotfix_scope:
        # 资产模式跳过编译；程序模式不覆盖默认资产清单。
        # both 先校验两个候选，再上传全部制品并逐份切换清单。
        description: "hotfix 发布范围"
        type: choice
        default: both
        options: [program, assets, both]
      hotfix_revision:
        # 该输入只用于维护发布，正整数边界由 preflight 检查。
        # 不通过字符串后缀改变正式版本号，也不隐式创建 release tag。
        description: "hotfix 递增修订号，普通任务留空"
        type: string
      asset_paths:
        # 路径由准备器限制在 assets 内，星号只表示显式选择全部。
        # 选择项不进入 shell 源码，支持含空格的真实资源路径。
        description: "相对 assets 的路径，每行一个；填 * 更新全部"
        type: string
permissions:
  # 基线 Release 检查只读，公开上传沿用服务器已有身份。
  contents: read
concurrency:
  # 普通 ci push 保留取消行为；hotfix 不允许半途取消。
  group: self-hosted-ci-${{ github.ref }}
  cancel-in-progress: ${{ inputs.job != 'hotfix' }}
jobs:
  build:
    # 子工作流保留固定 Runner、增量缓存、CTest 与聚合顺序。
    # source_ref 使用本次事件 SHA，避免运行期间分支推进导致串版。
    # 普通构建仍包含原来的所有平台和测试。
    if: github.event_name == 'push' || inputs.job == 'ci-build'
    uses: ./.github/workflows/build.yaml
    with:
      source_ref: ${{ github.sha }}
      pgo_instrument: ${{ github.event_name == 'push' || inputs.pgo_instrument }}
  mmm-website-release:
    # 发布子工作流仍读取已聚合 release，不因网站发布重新编译。
    # 发布串行组由子工作流管理，与 hotfix 切换清单互斥。
    # 保留旧入口的名称、默认选项和人工触发条件。
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'website-release'
    uses: ./.github/workflows/website-release.yaml
  hotfix:
    # 错误分支要在 preflight 显式失败，不能仅用 if 条件静默跳过。
    # 0.6.2 程序热修复会被拒绝，0.6.3 起才能比较同版本修订号。
    # 发布只沿用服务器凭据，不授予 GitHub token 额外写权限。
    # 分支与基线检查由被调用工作流在构建前执行。
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'hotfix'
    uses: ./.github/workflows/hotfix-release.yaml
    with:
      source_ref: ${{ github.sha }}
      scope: ${{ inputs.hotfix_scope }}
      revision: ${{ inputs.hotfix_revision }}
      asset_paths: ${{ inputs.asset_paths }}
      pgo_instrument: ${{ inputs.pgo_instrument }}
